<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Philip Austbø</title>
  <link rel="stylesheet" href="legacy-page.css" />
  <link rel="stylesheet" href="hours.css" />
  <link rel="stylesheet" href="minimal-header.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script defer src="minimal-header.js"></script>
<link rel="stylesheet" href="hybrid-secondary.css"><link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght..72,400;6..72,500&display=swap" rel="stylesheet"></head>
<body>
  <header class="sub-header"><a class="sub-brand" href="index.html">Philip Austbø</a><nav class="sub-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="hours.html" aria-current="page">Hours</a><a href="countries.html">Countries</a><a href="games.html">Games</a><a href="gemini.html">Chatbot</a><a href="football.html">Football</a></nav><a class="sub-back" href="index.html#projects">Back to projects</a><button class="sub-menu" aria-expanded="false">Menu</button></header>

  <main class="container">
    <section class="intro center">
      <h1>Hours of My Life</h1>
      <p>
        It is often said that mastery takes <strong>10,000 hours</strong>.<br>
        I created this tracker to explore how I have spent my time so far.
      </p>
    </section>

    <section class="chart-buttons center">
      <button class="chart-toggle" data-chart="pie">Pie chart</button>
      <button class="chart-toggle" data-chart="time">Timeline</button>
      <button class="chart-toggle" data-chart="bars">Progress bars</button>
    </section>


    <section class="chart-area">
      <canvas id="pieChart" class="chart-display"></canvas>
      <canvas id="timeChart" class="chart-display" style="display:none;"></canvas>
      <div id="barChart" class="chart-display" style="display:none;">
        <div class="bar" data-label="School years 1 to 10" data-hours="7914"></div>
        <div class="bar" data-label="Studying" data-hours="3000"></div>
        <div class="bar" data-label="Football" data-hours="4500"></div>
        <div class="bar" data-label="Gaming" data-hours="2000"></div>
        <div class="bar" data-label="Chess" data-hours="500"></div>
        <div class="bar" data-label="Travelling" data-hours="1200"></div>
        <div class="bar" data-label="Working" data-hours="1800"></div>
      </div>
    </section>
  </main>

  <script src="hours.js"></script>
</body>
</html>
