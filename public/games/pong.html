<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="A responsive single-player Pong game by Philip Austbø.">
  <title>Pong | Philip Austbø</title>
  <link rel="stylesheet" href="pong.css">
<link rel="stylesheet" href="../hybrid-secondary.css"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght;500;600&family=Newsreader:opsz,wght..72,400;6..72,500&display=swap" rel="stylesheet"></head>
<body>
  <header class="game-header">
    <a href="../games.html">Games</a>
    <strong>Pong</strong>
    <button id="new-game" type="button">New game</button>
  </header>
  <main>
    <div class="scoreboard" aria-live="polite">
      <span>You <b id="player-score">0</b></span>
      <span id="game-message">First to 7</span>
      <span><b id="computer-score">0</b> Computer</span>
    </div>
    <div id="game" tabindex="0" aria-label="Pong game. Use arrow keys, W and S, mouse, or touch to move your left paddle.">
      <canvas id="pong-canvas"></canvas>
      <div id="start-overlay">
        <p>PONG</p>
        <button id="start-game" type="button">Start game</button>
        <small>Move with the arrow keys, W and S, a mouse or touch<br>Press Space to pause</small>
      </div>
      <div id="pause-overlay" hidden>Paused</div>
    </div>
    <p class="instructions">Keep the ball in play. Change its angle by striking it away from the centre of your paddle.</p>
  </main>
  <script src="pong.js"></script>
</body>
</html>
